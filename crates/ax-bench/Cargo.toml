[package]
name = "ax-bench"
description = "C-72 : harnais de benchmarks d'AXION ENGINE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
# `deny` et non `forbid` : le crate ne contient aucun bloc `unsafe`, mais
# `forbid` interdirait a un test d'installer un allocateur compteur pour prouver
# l'absence d'allocation sur un chemin donne.
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
# Modele de resultat schema 2 (PARTIE 30.4) : serialise en JSON.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Composants mesures. Le module `cases` (partage entre benches et coureur CI) et
# le binaire `bench-ci` les appellent : ce sont des dependances de bibliotheque,
# pas seulement de test. Le harnais mesure ces crates, il est donc normal qu'il
# en depende.
ax-scene.workspace = true
ax-model.workspace = true
ax-asset.workspace = true
# B-08 (ADR-133 D2) : la charge physique de référence, et l'allocateur compteur que
# la variante mesurée installe.
ax-physics.workspace = true
ax-math.workspace = true
ax-mem.workspace = true
# ADR-146 §4 : bench-decomp appelle la décomposition (VHACD) comme ax-asset, au même parry3d.
parry3d.workspace = true

[dev-dependencies]
# R-2240 : criterion pour les micro-benchmarks Rust. `default-features = false`
# ecarte `plotters` (rapports HTML et son arbre de rendu) et `rayon` : les
# benches ne tracent rien et ne parallelisent pas leur mesure. On garde
# `cargo_bench_support`, sans quoi `cargo bench` ne saurait pas les executer.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

# Coureur de non-regression (R-2250) : mesure le sous-ensemble rapide, archive
# les resultats schema 2 et compare au dernier resultat archive.
[[bin]]
name = "bench-ci"
path = "src/bin/bench_ci.rs"

# B-08 (R-501, ADR-133 D2) : surcoût de l'allocateur compteur. Deux binaires aux
# charges identiques, l'un sur l'allocateur du système, l'autre sur le compteur :
# un allocateur global ne se change pas en cours d'exécution.
[[bin]]
name = "bench-alloc-system"
path = "src/bin/bench_alloc_system.rs"

[[bin]]
name = "bench-alloc-counted"
path = "src/bin/bench_alloc_counted.rs"

# R-501 par le calcul (ADR-133 A1) : les allocations des charges de B-08, comptees sous
# un allocateur qui ne fait que compter, multipliees par le surcout par allocation que la
# campagne B-08 archivee mesure. Jamais dans les binaires de B-08 : il fausserait la mesure.
[[bin]]
name = "bench-r501"
path = "src/bin/bench_r501.rs"

# ADR-146 §4 : la decomposition convexe par resolution (memoire, duree, enveloppes), pour
# fixer la plage et le defaut de collision.resolution (ADR-108). Poste de developpement :
# chiffres non publies (R-2252).
[[bin]]
name = "bench-decomp"
path = "src/bin/bench_decomp.rs"

# B-02 : propagation du graphe de scene vs nombre de nodes (PARTIE 30.2).
[[bench]]
name = "scene"
harness = false

# B-09 : compilation d'asset par format, taille et options (PARTIE 30.2).
[[bench]]
name = "asset"
harness = false
