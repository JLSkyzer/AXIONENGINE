[package]
name = "ax-bench"
description = "C-72 : harnais de benchmarks d'AXION ENGINE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
# `deny` et non `forbid` : le crate ne contient aucun bloc `unsafe`, mais
# `forbid` interdirait a un test d'installer un allocateur compteur pour prouver
# l'absence d'allocation sur un chemin donne.
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
# Modele de resultat schema 2 (PARTIE 30.4) : serialise en JSON.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# R-2240 : criterion pour les micro-benchmarks Rust. `default-features = false`
# ecarte `plotters` (rapports HTML et son arbre de rendu) et `rayon` : les
# benches ne tracent rien et ne parallelisent pas leur mesure. On garde
# `cargo_bench_support`, sans quoi `cargo bench` ne saurait pas les executer.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
# Composants mesures. Dev seulement : le harnais ne depend d'eux que pour les
# bencher, jamais en bibliotheque.
ax-scene.workspace = true
ax-model.workspace = true
ax-asset.workspace = true

# B-02 : propagation du graphe de scene vs nombre de nodes (PARTIE 30.2).
[[bench]]
name = "scene"
harness = false

# B-09 : compilation d'asset par format, taille et options (PARTIE 30.2).
[[bench]]
name = "asset"
harness = false
