[package]
name = "ax-ffi"
description = "C-14 : bibliothèque native d'AXION ENGINE et points d'entrée JNI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Le nom de la bibliothèque produite est fixé par R-420 : il doit être unique au
# projet, car le chargeur Java appelle `System.load` sur un chemin absolu et ne
# doit jamais entrer en collision avec la bibliothèque native d'un autre mod.
name = "axion_native"
# `cdylib` pour la bibliothèque chargée par la JVM ; `rlib` pour que les tests
# et les outils du workspace puissent lier le crate.
crate-type = ["cdylib", "rlib"]

[lints.rust]
# `deny` et non `forbid` : les points d'entrée exportés vers la JVM sont
# nécessairement `unsafe`, et chaque bloc portera sa justification `// SAFETY:`.
# `forbid` ne pourrait pas être levé localement.
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
ax-core.workspace = true
# C-20..C-24 : la compilation d'un asset traverse la frontiere (IF-06).
ax-asset.workspace = true
# C-32 : le pont CREATE_ASSEMBLY construit des formes composées (Vec3/Quat) à
# partir des colliders compilés avant de les remettre à ax-physics.
ax-math.workspace = true
# C-12 : le pool de jobs appartient a la session, comme les tampons.
ax-jobs.workspace = true
ax-model.workspace = true
# C-31 : le cycle de simulation (IF-03) pilote la physique ; le Session détient
# un SimDriver, et axion_sim_submit/collect l'entraînent.
ax-physics.workspace = true
# C-15 : les metriques appartiennent a la session aussi, et l'export de R-502
# traverse la frontiere.
ax-telemetry.workspace = true
# C-30 / ADR-119 : la liste de dessin au repos d'un asset chargé est calculée par
# le scene graph, qui en détient la propagation et la règle de visibilité.
ax-scene.workspace = true
# C-13 / ADR-119 : les assets chargés sont imputés à l'arène PERSISTENT (R-480).
ax-mem.workspace = true
ciborium.workspace = true
jni.workspace = true

# C-15 (R-500) : temps CPU du thread du pas de simulation, distingué du temps mural ; le
# module `cpu_clock` les emploie, ici parce que R-2120 confine `unsafe` à la frontière native.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Le test d'integration exerce l'ABI comme Java le fera : il doit pouvoir
# encoder une configuration et relire un en-tete de tampon.
ax-model.workspace = true
ciborium.workspace = true
