[package]
name = "ax-jobs"
description = "C-12 : ordonnancement, annulation et deadlines des travaux d'AXION ENGINE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.rust]
# `deny` et non `forbid` : la bibliothèque ne contient aucun bloc `unsafe`, mais
# `forbid` ne peut pas être levé localement et interdirait à un test d'installer
# un allocateur global compteur — `GlobalAlloc` est un trait `unsafe` — pour
# prouver qu'un chemin de code n'alloue pas (INV-08, T-016).
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
rayon.workspace = true
