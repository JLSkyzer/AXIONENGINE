[package]
name = "ax-asset"
description = "C-20..C-25 : compilation, conteneur A3D et cache d'assets d'AXION ENGINE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
# `deny` et non `forbid` : la bibliothèque ne contient aucun bloc `unsafe`, mais
# `forbid` ne peut pas être levé localement et interdirait à un test d'installer
# un allocateur global compteur — `GlobalAlloc` est un trait `unsafe` — pour
# prouver qu'un chemin de code n'alloue pas (INV-08, T-016).
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
# Le modele de donnees (DM-*) : le validateur examine ses structures, il ne
# les redeclare pas.
ax-model.workspace = true
crc32c.workspace = true
gltf.workspace = true
meshopt.workspace = true
mikktspace.workspace = true
stl_io.workspace = true
tobj.workspace = true
zstd.workspace = true
