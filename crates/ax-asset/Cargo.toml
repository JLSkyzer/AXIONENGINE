[package]
name = "ax-asset"
description = "C-20..C-25 : compilation, conteneur A3D et cache d'assets d'AXION ENGINE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
# `deny` et non `forbid` : `unsafe` n'est admis que dans `foreign_heap`, seule porte
# d'entrée vers meshoptimizer et zstd, qui y reçoivent l'allocateur compteur (INV-08).
# `forbid` ne pourrait pas y être levé.
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
# INV-08 : l'allocateur que reçoivent meshoptimizer et zstd (`foreign_heap`).
ax-mem.workspace = true
# Le modele de donnees (DM-*) : le validateur examine ses structures, il ne
# les redeclare pas.
ax-model.workspace = true
crc32c.workspace = true
gltf.workspace = true
meshopt.workspace = true
mikktspace.workspace = true
# C-32, étapes 8-9 (R-551, ADR-108) : décomposition convexe VHACD à la
# compilation. Même `parry3d` que `rapier3d`, `enhanced-determinism` unifié pour
# un résultat identique entre plateformes (ADR-108/ADR-116).
parry3d.workspace = true
# PARTIE 6.4 (ADR-135) : le lecteur strict des options `.axion.json`. Le
# tokeniseur de `serde_json` — déjà dans l'arbre par `gltf-json` — et un visiteur
# propre, qui refuse une clé en double que `serde_json::Value` garderait.
# Écart à la table 32.2, qui écarte `serde_json` du runtime : borné à ce seul
# lecteur par l'ADR-136. Tout autre JSON du jeu reste lu côté Java.
serde.workspace = true
# `raw_value` : le bloc `axion` des extras d'un glTF se relit tel qu'écrit.
serde_json = { workspace = true, features = ["raw_value"] }
stl_io.workspace = true
tobj.workspace = true
# C-24 : libzstd par ses liaisons, pour lui donner l'allocateur compteur (INV-08).
zstd-sys.workspace = true

[dev-dependencies]
# Témoin : `foreign_heap` rend les octets de `zstd::bulk`, au bit près.
zstd.workspace = true
