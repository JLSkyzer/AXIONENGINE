[package]
name = "ax-core"
description = "C-10 : contexte natif, handles et états du runtime d'AXION ENGINE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
# `deny` et non `forbid` : `forbid` ne peut pas être levé localement, et deux
# dérogations justifiées sont nécessaires — la vue en octets d'un tampon
# partagé (IF-02), et un test qui installerait un allocateur global compteur,
# `GlobalAlloc` étant un trait `unsafe` (INV-08, T-016). Chaque bloc porte sa
# justification `// SAFETY:`.
unsafe_code = "deny"
missing_docs = "warn"

[dependencies]
ax-model.workspace = true
