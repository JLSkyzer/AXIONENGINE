# Version de rustc epinglee.
#
# C-16 : la matrice de validation deterministe est definie pour cette version
# exacte. Un changement de version majeure impose de rejouer, et si necessaire
# de regenerer, les vecteurs d'or, avec increment de DET_KERNEL_VERSION.
[toolchain]
channel = "1.94.0"
components = ["rustfmt", "clippy"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
]
profile = "minimal"
