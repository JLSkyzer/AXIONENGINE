# Garde-fous sur les dependances Rust (R-2301).
#
# cargo-deny bloque en CI : licence non allowlistee, avis RustSec, doublon non
# justifie, source hors crates.io.
[graph]
all-features = true

[advisories]
# Tout avis RustSec est bloquant : la CI ne publie pas une dependance vulnerable.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Licences compatibles avec Apache-2.0, licence du projet (PARTIE 32.1).
# Toute licence hors de cette liste bloque le build et exige un examen.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # Boost Software License : permissive, approuvee par l'OSI, plus souple que
    # BSD-2-Clause. Ajoutee pour xxhash-rust, que la table 32.2 retient en
    # annoncant BSD-2-Clause alors que le crate est sous BSL-1.0. L'ecart est
    # consigne dans docs/decisions/ADR-105.md.
    "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
# Un doublon de version est signale sans bloquer : les doublons observes
# viennent tous d'arbres transitifs qu'AXION ne choisit pas — `jni` tire une
# vieille `windows-sys`, `gltf` une autre version de `syn`. Bloquer la-dessus
# reviendrait a exiger de corriger le graphe d'autrui. Un doublon parmi les
# dependances *directes*, lui, se verrait dans la revue de Cargo.toml.
multiple-versions = "warn"
# Une dependance sans version est un joker, et un joker laisse la resolution
# decider a notre place.
wildcards = "deny"
# Sauf entre crates du workspace, relies par chemin : aucune resolution n'entre
# en jeu, la version est celle du dossier d'a cote. L'option ne vaut que pour des
# crates prives, d'ou le `publish = false` du workspace.
allow-wildcard-paths = true
deny = []
skip = []

[sources]
# R-2301 : aucune dependance hors de crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
