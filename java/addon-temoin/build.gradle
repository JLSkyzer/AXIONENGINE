// CAP-49 (ADR-162, tranche 5) : l'addon temoin.
//
// Un mod Forge separe, qui declare du contenu a AXION exactement comme un addon tiers : il ne voit que
// l'API publique (axion-api), jamais l'implementation (axion-mod). S'il compile, un addon peut s'ecrire
// avec l'API seule ; la CI le compile a chaque build. Les lancements de developpement d'AXION le chargent
// comme un mod a part, et un GameTest verifie son contenu en jeu (AddonTemoinGameTests).
//
// Le guide d'addon du site (docs/guides/addons) tire ses extraits de code de ces fichiers : ils sont
// donc toujours compiles et toujours a jour.
apply plugin: 'net.minecraftforge.gradle'

base {
    archivesName = 'axion-addon-temoin'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // L'API seule, a la compilation : AXION la fournit en jeu (ADR-162 D11). Un addon publie la
    // declare de meme, depuis le depot Maven d'AXION, et ne l'embarque jamais.
    compileOnly project(':axion-api')
}

// Le modele de mod a telecharger (CAP-49) : les sources du temoin, telles quelles, avec les fichiers d'un projet
// autonome (modele/) et le lanceur Gradle du depot. Un debutant le decompresse et lance ./gradlew runClient :
// AXION et son API viennent de maven.eriniumlab.com. Les versions sont celles de ce build, inscrites dans son
// gradle.properties.
def modeleZip = tasks.register('modeleZip', Zip) {
    group = 'publishing'
    description = 'Construit le modele de mod autonome (axion-addon-template).'
    archiveBaseName = 'axion-addon-template'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    def valeurs = [
            forge_version    : forge_version,
            axion_api_version: project(':axion-api').version.toString(),
            axion_version    : project(':axion-mod').version.toString(),
    ]
    inputs.properties valeurs
    // Les reperes d'extrait du guide (« --8<-- ») ne servent qu'au site : le modele ne les porte pas.
    filesMatching(['**/*.java', '**/*.gradle', '**/*.toml']) {
        filter { String ligne -> ligne.contains('--8<--') ? null : ligne }
    }
    from(file('modele')) {
        filesMatching('gradle.properties') { expand valeurs }
    }
    from(file('src')) { into 'src' }
    from(rootProject.file('gradlew'))
    from(rootProject.file('gradlew.bat'))
    from(rootProject.file('gradle/wrapper')) { into 'gradle/wrapper' }
    from(rootProject.file('LICENSE'))
}

// Publie avec l'API et AXION : https://maven.eriniumlab.com/<snapshots|releases>/dev/axion/axion-addon-template/.
apply from: rootProject.file('gradle/publication.gradle')

publishing {
    publications {
        register('modele', MavenPublication) {
            artifactId = 'axion-addon-template'
            artifact(modeleZip)
            axionPom(pom, 'AXION addon template', 'Modele de mod pret a lancer pour ecrire un addon AXION.')
        }
    }
}
