// C-70 : API publique d'AXION ENGINE.
//
// R-1750 : module Gradle separe, publie independamment, sans dependance a
// l'implementation ni au natif. Il depend en revanche des types Minecraft
// (Level, Entity) qu'il expose dans sa surface (PARTIE 23.2), d'ou ForgeGradle.
// R-1751 : versionnement semantique propre, independant de celui du mod.
// R-1752 : aucune annotation @Internal ici.
apply plugin: 'net.minecraftforge.gradle'

base {
    archivesName = 'axion-api'
}

// R-1751 : l'artefact porte la version de l'API, pas celle du mod. Elle vaut
// ApiVersion.CURRENT (verifie par ApiArtifactVersionTest), suffixee de -SNAPSHOT tant
// qu'aucune release ne la publie (-Paxion.release, 34.4).
version = axion_api_version + (project.hasProperty('axion.release') ? '' : '-SNAPSHOT')

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

java {
    withSourcesJar()
    // 37.2 : l'API de M2 "compile et documentee" ; 34.4 : axion-api se publie en
    // jar, sources et javadoc. La Javadoc se genere donc a chaque build.
    withJavadocJar()
}

javadoc {
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    // Tout doclint, et un avertissement fait echouer : un parametre non decrit ou
    // un lien casse se voit au build, pas dans la documentation publiee.
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}
