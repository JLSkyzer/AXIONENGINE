// Le mod Forge AXION ENGINE.
//
// Les classes de :axion-api sont embarquees dans le JAR final : l'artefact
// publie contient dev/axion/**/*.class, y compris dev/axion/api/** (33.2).
// L'API est aussi publiee separement comme artefact propre (R-1750).
evaluationDependsOn(':axion-api')

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

// Production, empaquetage et controle de la bibliotheque native (34.1).
apply from: rootProject.file('gradle/natives.gradle')

base {
    archivesName = mod_id
}

// Contenu d'essai (T-b4 d'ADR-122) : modèles et definitions chargés par les lancements de
// développement, jamais empaquetés — le mod livré n'embarque que ses definitions de
// démonstration (R-1790).
sourceSets {
    devcontent
}

// Ses GameTests (§29.5) compilent contre le mod et Minecraft, et ne vivent qu'en développement,
// comme ses definitions.
configurations {
    devcontentImplementation.extendsFrom implementation
}
dependencies {
    devcontentImplementation sourceSets.main.output
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Requis par ce template : fait tourner processResources sur les sorties de
    // l'IDE avant le lancement du jeu.
    copyIdeResources = true

    runs {
        configureEach {
            // Les repertoires de travail restent a la racine du depot.
            workingDirectory rootProject.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    // L'API fait partie du meme mod en developpement.
                    source project(':axion-api').sourceSets.main
                    // Le contenu d'essai aussi, en developpement seulement.
                    source sourceSets.devcontent
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Mode developpeur d'AXION (paragraphe 31.3, ADR-121) : rend les overlays de
            // debug disponibles. Le client de developpement seulement ; inerte en
            // production (R-2270).
            property 'axion.dev', 'true'
        }

        server {
            // Un dossier à part : un client de développement lancé en même temps tourne dans `run`,
            // et deux instances dans un même dossier y mêleraient journaux et monde (essai de D8,
            // ADR-150).
            workingDirectory rootProject.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            // Un dossier à part, dont le monde est effacé avant chaque passage : les GameTests
            // partent d'un monde neuf (R-2190) et ne laissent rien dans celui de développement.
            workingDirectory rootProject.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        renderTest {
            // Banc de rendu client (ADR-126) : un client qui joue son scénario, écrit son rapport
            // et s'arrête seul. Un dossier à part, dont le monde est effacé avant chaque passage ;
            // le contrôle de l'état GL (R-1503) y est actif. Le backend est imposé : laissé à
            // `auto`, ce serait le natif, et plus rien ne vérifierait le vanilla (R-1491).
            parent minecraft.runs.client
            workingDirectory rootProject.file('run-rendertest')
            property 'axion.rendertest', 'm3'
            property 'axion.debug.gl', 'true'
            property 'axion.render.backend', 'vanilla'
            args '--width', '854', '--height', '480'
        }

        renderTestNative {
            // Le même banc sur le backend natif (ADR-127 §7), dans son propre dossier : le banc
            // échoue si ce n'est pas lui qui dessine.
            parent minecraft.runs.client
            workingDirectory rootProject.file('run-rendertest-native')
            property 'axion.rendertest', 'm3'
            property 'axion.debug.gl', 'true'
            property 'axion.render.backend', 'native'
            args '--width', '854', '--height', '480'
        }

        renderTestShaders {
            // Le banc sous Oculus et son shaderpack de test (T-480, T-490), dans son propre dossier.
            // Le backend n'est pas imposé : c'est la sélection automatique (R-1490) qui doit
            // retenir le vanilla parce qu'un mod de shaders est là.
            parent minecraft.runs.client
            workingDirectory rootProject.file('run-rendertest-shaders')
            property 'axion.rendertest', 'm3'
            property 'axion.rendertest.shaders', 'true'
            property 'axion.debug.gl', 'true'
            // Les mixins d'Oculus et d'Embeddium, remappés par fg.deobf, retrouvent leurs cibles
            // sous les noms de développement.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--width', '854', '--height', '480'
        }

        data {
            workingDirectory rootProject.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Ressources produites par les generateurs de donnees.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// R-2231 : un resultat de benchmark porte le commit qu'il mesure. Le build l'ecrit dans une
// ressource que /axion bench relit (BuildInfo) ; un arbre suivi modifie le dit (`-dirty`), sans
// quoi la mesure d'un code non commite passerait pour celle du commit. La tache tourne a chaque
// build ; tant que le commit ne change pas, le contenu non plus, et processResources reste a jour.
def buildInfoDir = layout.buildDirectory.dir('generated/buildinfo')
def generateBuildInfo = tasks.register('generateBuildInfo') {
    group = 'axion'
    description = 'Commit du build, pour la provenance des benchmarks (R-2231)'
    def root = rootDir
    outputs.dir(buildInfoDir)
    outputs.upToDateWhen { false }
    doLast {
        def git = { List<String> args ->
            try {
                def process = (['git'] + args).execute(null, root)
                String text = process.text.trim()
                return process.waitFor() == 0 ? text : null
            } catch (IOException ignored) {
                return null
            }
        }
        String commit = git(['rev-parse', 'HEAD']) ?: System.getenv('GITHUB_SHA') ?: 'inconnu'
        String changes = git(['status', '--porcelain', '--untracked-files=no'])
        if (changes) {
            commit = commit + '-dirty'
        }
        File file = buildInfoDir.get().file('axion-build.properties').asFile
        String content = 'commit=' + commit + '\n'
        if (!file.exists() || file.getText('UTF-8') != content) {
            file.parentFile.mkdirs()
            file.setText(content, 'UTF-8')
        }
    }
}
sourceSets.main.resources { srcDir generateBuildInfo }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation project(':axion-api')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Tests unitaires cote Java. La CI execute `cargo nextest` et JUnit cote a
    // cote (34.3, job test-unit).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // R-2240 : JMH pour les micro-benchmarks Java (B-07, aller-retour FFI). La
    // PARTIE 32.2 le retient en « tests seulement » : il n'est jamais embarque
    // dans le JAR du mod, seulement present a l'execution des benchmarks. Les
    // classes @Benchmark vivent dans src/test/java (arbre fige, PARTIE 33), sans
    // nouveau source set.
    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

// Le mod de shaders du banc runRenderTestShaders (T-480, T-490) : Oculus, et Embeddium dont il
// dépend, depuis le dépôt Maven de Modrinth, en versions figées (accord de Killian, 2026-10-12).
// Ils ne rejoignent le classpath que lorsque ce banc est demandé : ni runClient, ni les autres
// bancs, ni le JAR livré ne les voient — AXION n'en dépend pas, il les détecte (H-09). Pour un
// essai à la main sous Oculus : `./gradlew runClient -Paxion.shaderMods`.
repositories {
    // Pas d'exclusiveContent : les versions remappées par fg.deobf, du même groupe, viennent du
    // dépôt local de ForgeGradle.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
if (project.hasProperty('axion.shaderMods')
        || gradle.startParameter.taskNames.any { it.endsWith('runRenderTestShaders') }) {
    dependencies {
        runtimeOnly fg.deobf('maven.modrinth:oculus:1.20.1-1.8.0')
        runtimeOnly fg.deobf('maven.modrinth:embeddium:0.3.31+mc1.20.1')
    }
}

// ForgeGradle cree ses taches run apres l'evaluation du script : `tasks.named`
// echouerait ici, `tasks.matching {}.configureEach` configure la tache des
// qu'elle apparait.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete rootProject.file('run-gametest/world')
        // Un cache d'assets neuf : chaque passage compile ses sources, et ce qu'une compilation
        // journalise (ADR-148) s'y constate — un asset repris du cache ne dit rien.
        delete rootProject.file('run-gametest/axion/cache')
        // Un monde reproductible (R-2190, ADR-124 §5) : plat, de graine fixe, sans structure ni
        // créature. Sans server.properties, le serveur de GameTests générait un monde normal de
        // graine aléatoire : selon la graine, l'eau d'un aquifère gagnait une arène et y emportait
        // un cube (CI de 6cdc2ec, 2026-10-12), et des créatures auraient pu pousser les corps par
        // leurs proxies (R-614). Les autres réglages du fichier sont gardés.
        def proprietes = rootProject.file('run-gametest/server.properties')
        def reglages = new Properties()
        if (proprietes.exists()) {
            proprietes.withInputStream { reglages.load(it) }
        }
        reglages.putAll([
                'level-type'         : 'minecraft:flat',
                'level-seed'         : '20261012',
                'generate-structures': 'false',
                'difficulty'         : 'peaceful',
                'spawn-monsters'     : 'false',
                'spawn-animals'      : 'false',
                'spawn-npcs'         : 'false',
        ])
        proprietes.parentFile.mkdirs()
        proprietes.withOutputStream { reglages.store(it, 'AXION : monde des GameTests reproductible (ADR-124 5)') }
    }
}

// Le client de développement ne se met pas en pause quand sa fenêtre perd le focus : un essai lancé
// pendant qu'une autre application est au premier plan resterait figé sur le menu de pause, le monde
// solo arrêté. L'option est reposée à chaque lancement ; F3+P la bascule le temps d'une partie. Les
// bancs de rendu la règlent eux-mêmes (`BancDeRendu.reglerLesOptions`).
tasks.matching { it.name == 'runClient' }.configureEach {
    doFirst {
        def options = rootProject.file('run/options.txt')
        def lignes = options.exists()
                ? options.readLines('UTF-8').findAll { !it.startsWith('pauseOnLostFocus:') }
                : []
        lignes << 'pauseOnLostFocus:false'
        options.parentFile.mkdirs()
        options.setText(lignes.collect { it + System.lineSeparator() }.join(''), 'UTF-8')
    }
}

// Banc de rendu (ADR-126), sur chaque backend : un monde et un rapport neufs à chaque passage ; la
// tâche échoue si le rapport manque ou n'est pas vert.
['runRenderTest': 'run-rendertest', 'runRenderTestNative': 'run-rendertest-native',
        'runRenderTestShaders': 'run-rendertest-shaders'].each { tache, dossier ->
    tasks.matching { it.name == tache }.configureEach {
        doFirst {
            delete rootProject.file("${dossier}/saves/axion-rendertest")
            delete rootProject.file("${dossier}/axion-rendertest")
            // Un cache de shaders neuf : le premier démarrage compile, les suivants relisent (T-905).
            delete rootProject.file("${dossier}/axion/cache")
            // Un cache d'assets du client neuf (ADR-150 D3) : chaque passage compile chez le client,
            // et une compilation qui n'avancerait pas s'y voit — un asset repris du cache ne compile rien.
            delete rootProject.file("${dossier}/axion/client-cache")
            // T-483 : le pack de test que le banc active puis retire, posé neuf.
            def pack = rootProject.file("${dossier}/resourcepacks/axion_banc_pack")
            delete pack
            copy {
                from file('src/devcontent/resourcepacks/axion_banc_pack')
                into pack
            }
        }
        doLast {
            def rapport = rootProject.file("${dossier}/axion-rendertest/rapport.json")
            if (!rapport.exists()) {
                throw new GradleException("banc de rendu : aucun rapport (${rapport}) — le client s'est arrêté avant d'écrire")
            }
            def contenu = new groovy.json.JsonSlurper().parse(rapport, 'UTF-8')
            if (contenu.verdict != 'vert') {
                def rouges = contenu.tests.findAll { it.verdict == 'rouge' }.collect { "${it.id} : ${it.detail}" }
                throw new GradleException("banc de rendu rouge :\n  " + rouges.join('\n  '))
            }
            logger.lifecycle("banc de rendu vert : ${contenu.tests.collect { it.id }.join(', ')}")
            // Une vérification mesurée sans être jugée (rendu logiciel, ADR-127 §4) se dit, même au vert.
            def nonJuges = contenu.tests.findAll { it.verdict == 'non jugé' }.collect { it.id }
            if (nonJuges) {
                logger.warn("banc de rendu : non jugé(s) — ${nonJuges.join(', ')} (voir rapport.json)")
            }
        }
    }
}

// Sous Oculus (T-480, T-490) : le shaderpack de test, écrit pour le banc, et la configuration
// d'Oculus qui l'active, posés neufs avant chaque passage.
tasks.matching { it.name == 'runRenderTestShaders' }.configureEach {
    doFirst {
        def jeu = rootProject.file('run-rendertest-shaders')
        delete new File(jeu, 'shaderpacks/axion_banc')
        copy {
            from file('src/devcontent/shaderpacks/axion_banc')
            into new File(jeu, 'shaderpacks/axion_banc')
        }
        def config = new File(jeu, 'config/oculus.properties')
        config.parentFile.mkdirs()
        config.setText('shaderPack=axion_banc\nenableShaders=true\n', 'UTF-8')
    }
}

tasks.matching { it.name in ['runServer', 'runClient', 'runGameTestServer'] }.configureEach {
    // Sans cela, la console du serveur ne lit rien : impossible de lui envoyer
    // une commande, ni `stop`. Or un serveur tue par un timeout ne declenche
    // jamais son evenement d'arret, et l'arret propre ne serait donc jamais
    // verifie.
    standardInput = System.in
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Le test de la frontiere charge la bibliotheque native construite par
    // cargo. M0.8 rendra cette construction dependance du build ; d'ici la, le
    // test se declare non applicable si le binaire n'est pas la, en disant
    // comment le produire.
    systemProperty 'axion.native.dir', rootProject.file('target/release').absolutePath
    // T-020 verifie R-401 sur les sources : aucune classe hors de
    // dev.axion.forge n'importe net.minecraftforge.
    systemProperty 'axion.source.dir', file('src/main/java').absolutePath
    // R-2392 verifie que les tests declares par un jalon clos existent
    // toujours ; il lit pour cela les sources de test, des deux cotes.
    systemProperty 'axion.test.dir', file('src/test/java').absolutePath
    // Les GameTests et le banc de rendu portent aussi des tests de jalon (M3).
    systemProperty 'axion.devcontent.dir', file('src/devcontent/java').absolutePath
    // T-019 (INV-12) lit le bytecode du moteur : aucun appel GL hors du render thread.
    systemProperty 'axion.classes.dir', sourceSets.main.java.classesDirectory.get().asFile.absolutePath
    // R-1751 : la version que porte l'artefact axion-api, confrontee a ApiVersion.CURRENT.
    // Lue au lancement de la JVM de test : a la configuration d'axion-mod, celle d'axion-api
    // n'a peut-etre pas encore fixe sa version.
    def apiProject = project(':axion-api')
    // Declaree en entree : sans cela, un changement de version laisserait les tests a jour.
    inputs.property('axion.api.artifact.version', provider { apiProject.version.toString() })
    jvmArgumentProviders.add({ ['-Daxion.api.artifact.version=' + apiProject.version] } as CommandLineArgumentProvider)
    // T-022 et T-023 verifient sur les deux cotes : aucune connexion sortante,
    // et tout code d'erreur documente en ANNEXE A.1.
    systemProperty 'axion.crates.dir', rootProject.file('crates').absolutePath
    systemProperty 'axion.spec.file',
            rootProject.file('cdc/AXIONENGINE_Cahier_des_Charges_v1.0.md').absolutePath
    // T-284 (R-1783) : le schema publie est le rendu exact du validateur, et
    // toute definition du depot le respecte. `-Daxion.schema.update=true`
    // regenere le fichier au lieu de seulement le comparer.
    systemProperty 'axion.schema.file', rootProject.file('docs/schema/definition-1.json').absolutePath
    systemProperty 'axion.repo.dir', rootProject.projectDir.absolutePath
    systemProperty 'axion.schema.update', System.getProperty('axion.schema.update', 'false')
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// R-2240 : lance les micro-benchmarks JMH (classes @Benchmark de src/test/java).
// La bibliotheque native doit exister ; on la construit avec
// `cargo build -p ax-ffi --release`, et le dossier ou la trouver est passe au
// benchmark. JMH fork un JVM par benchmark : le fork herite de l'environnement
// du processus, on passe donc le dossier par une variable d'environnement. Un
// -jvmArgs ne marcherait pas ici : JMH resplit sa valeur sur les espaces, et le
// chemin du depot en contient un.
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Micro-benchmarks JMH (B-07, aller-retour FFI)'
    dependsOn 'testClasses'
    mainClass = 'org.openjdk.jmh.Main'
    classpath = sourceSets.test.runtimeClasspath
    environment 'AXION_NATIVE_DIR', rootProject.file('target/release').absolutePath
    // Des arguments JMH supplementaires se passent par -Pjmh.args="..." (regex de
    // benchmark, nombre d'iterations, forks) et surchargent les annotations.
    if (project.hasProperty('jmh.args')) {
        args((project.property('jmh.args') as String).split('\\s+'))
    }
}

// Developpe les proprietes du projet dans les ressources qui les referencent.
// Une propriete manquante fait echouer le build.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // Embarque l'API dans l'artefact du mod ; reobfJar traite ensuite
    // l'ensemble, API comprise.
    from project(':axion-api').sourceSets.main.output

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                // Pas d'horodatage : R-2342 impose un build reproductible, et
                // une date d'assemblage suffirait a rendre deux artefacts du
                // meme code differents — donc a priver toute empreinte publiee
                // de sa valeur.
        ])
    }

    finalizedBy 'reobfJar'
}
