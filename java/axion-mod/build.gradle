// Le mod Forge AXION ENGINE.
//
// Les classes de :axion-api sont embarquees dans le JAR final : l'artefact
// publie contient dev/axion/**/*.class, y compris dev/axion/api/** (33.2).
// L'API est aussi publiee separement comme artefact propre (R-1750).
evaluationDependsOn(':axion-api')

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

// Production, empaquetage et controle de la bibliotheque native (34.1).
apply from: rootProject.file('gradle/natives.gradle')

base {
    archivesName = mod_id
}

// Contenu d'essai (T-b4 d'ADR-122) : modèles et definitions chargés par les lancements de
// développement, jamais empaquetés — le mod livré n'embarque que ses definitions de
// démonstration (R-1790).
sourceSets {
    main {
        // Les exemples d'AXION (R-1790), à la racine du JAR sous axion/ : AXION les enregistre par son API
        // publique, comme un addon enregistre son dossier (ADR-162 D3, D10 ; ADR-161 D3).
        resources.srcDir rootProject.file('content/examples')
    }
    devcontent {
        // Le contenu de test et, s'il est là, le contenu personnel de Killian (la Charger des films), hors du
        // dépôt public (ADR-161 D1) : en développement, ils rejoignent le dossier axion/ du mod.
        resources.srcDir rootProject.file('content/test')
        resources.srcDir rootProject.file('local/contenu')
    }
}

// Ses GameTests (§29.5) compilent contre le mod et Minecraft, et ne vivent qu'en développement,
// comme ses definitions.
configurations {
    devcontentImplementation.extendsFrom implementation
}
dependencies {
    devcontentImplementation sourceSets.main.output
}

// T-437 (R-1711) : l'audit des fichiers écrits pendant une session de GameTests. La JVM du serveur enregistre
// chaque écriture avec sa pile (JFR) ; runGameTestServer relève son dossier avant le passage et vérifie
// après, par tools/ci/audit_ecritures.py.
def auditEcritures = layout.buildDirectory.dir('audit-ecritures').get().asFile
def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def python = windows ? 'python' : 'python3'

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Requis par ce template : fait tourner processResources sur les sorties de
    // l'IDE avant le lancement du jeu.
    copyIdeResources = true

    // Un client lancé par un agent ne capture pas la souris (`SourisLibre`, contenu de développement) : piloté à
    // distance en plein écran, le poste resterait enfermé dans la fenêtre du jeu. Le film et les bancs, toujours ;
    // runClient, quand un agent le lance (CLAUDECODE) ou sous -Paxion.sourisLibre=true.
    def sourisLibre = (findProperty('axion.sourisLibre') ?: (System.getenv('CLAUDECODE') == '1')).toString()
    // Un client lancé par un agent s'ouvre sur l'écran secondaire (`EcranSecondaire`, contenu de développement) :
    // l'écran principal reste à Killian. Tous les lancements qui héritent de `client`, ou -Paxion.ecranSecondaire=true.
    def ecranSecondaire = (findProperty('axion.ecranSecondaire') ?: (System.getenv('CLAUDECODE') == '1')).toString()

    runs {
        configureEach {
            // Les repertoires de travail restent a la racine du depot.
            workingDirectory rootProject.file('.runs/client')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    // L'API fait partie du meme mod en developpement.
                    source project(':axion-api').sourceSets.main
                    // Le contenu d'essai aussi, en developpement seulement.
                    source sourceSets.devcontent
                }
                // CAP-49 : l'addon temoin, un mod a part, comme un addon tiers (AddonTemoinGameTests).
                example_addon {
                    source project(':addon-temoin').sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Mode developpeur d'AXION (paragraphe 31.3, ADR-121) : rend les overlays de
            // debug disponibles. Le client de developpement seulement ; inerte en
            // production (R-2270).
            property 'axion.dev', 'true'
            property 'axion.souris.libre', sourisLibre
            property 'axion.ecran.secondaire', ecranSecondaire
            // ADR-162 D9 : /axion dev reload, en développement.
            property 'axion.content.dev_reload', 'true'
        }

        server {
            // Un dossier à part : un client de développement lancé en même temps tourne dans `run`,
            // et deux instances dans un même dossier y mêleraient journaux et monde (essai de D8,
            // ADR-150).
            workingDirectory rootProject.file('.runs/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            // ADR-168, essai de la prédiction : son propre monde, le monde de runServer reste intact. Les véhicules d'un
            // essai précédent, que le journal latéral garde, l'essai les retire lui-même de sa piste.
            if (System.getenv('AXION_ESSAI_PREDICTION') == '1') {
                args '--world', 'essai-prediction'
                // AXION_ESSAI_VEHICULE peut nommer un véhicule d'exemple (le buggy, ses variables et ses commandes).
                property 'axion.content.examples', 'true'
                // Le défaut ouvert de sa connexion (précision 6c-B) : chaque lecture et écriture de socket du serveur.
                jvmArg "-XX:StartFlightRecording=filename=${rootProject.file('.runs/server/essai-reseau.jfr')},settings=${rootProject.file('tools/ci/essai_reseau.jfc')},dumponexit=true"
            }
            // ADR-162 D9 : /axion dev reload, en développement.
            property 'axion.content.dev_reload', 'true'
        }

        essaiClientAddons {
            // ADR-165 D3, essai de bout en bout : ce client se connecte au serveur de runServer, lancé sous
            // AXION_ESSAI_ADDON_EXIGE=<modId>@<version> (EssaiAddonsExiges, contenu de développement), écrit au
            // journal l'écran de déconnexion, puis s'arrête.
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/essai-client')
            property 'axion.essai.deconnexion', 'true'
            property 'axion.souris.libre', 'true'
        }

        essaiClientPrediction {
            // ADR-168, essai à deux processus (EssaiPrediction, contenu de développement) : ce client se connecte au
            // serveur de runServer, lancé sous AXION_ESSAI_PREDICTION=1, par un relais qui retarde chaque sens de
            // -PessaiLatence millisecondes (100 par défaut) ; il conduit, mesure, écrit son rapport, puis s'arrête.
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/essai-prediction')
            property 'axion.essai.prediction', (project.findProperty('essaiLatence') ?: '100').toString()
            // -PessaiConnexionSeule : se connecter, dire en combien de tentatives, s'arrêter (défaut de connexion, 6c-B).
            property 'axion.essai.connexion_seule', project.hasProperty('essaiConnexionSeule').toString()
            // -PessaiBasculer=<variable> : la commande liée à cette variable s'enfonce un tick (ADR-168 D6, 6d-2).
            property 'axion.essai.basculer', (project.findProperty('essaiBasculer') ?: '').toString()
            // -PessaiRapports=<n> : rapports passés avant d'accélérer (la première d'une boîte manuelle).
            property 'axion.essai.rapports', (project.findProperty('essaiRapports') ?: '0').toString()
            // -PessaiGigue=<ms> : le relais retarde chaque morceau de 0 à <ms> de plus, au hasard, l'ordre gardé.
            property 'axion.essai.gigue', (project.findProperty('essaiGigue') ?: '0').toString()
            // -PessaiProlonger=<s> : après la conduite, le conducteur reste assis <s> secondes, pour la cadence (6e).
            property 'axion.essai.prolonger', (project.findProperty('essaiProlonger') ?: '0').toString()
            // -PessaiFilm : l'essai se filme (Tournage), en 1920 x 984 ; tools/film/encoder.py fait le MP4.
            property 'axion.essai.film', project.hasProperty('essaiFilm').toString()
            // La course de connexion de Forge 47 : le mod la rattrape lui-même (ADR-169) ; -PessaiRelance ajoute la relance
            // de l'essai, l'expérience qui en a confirmé la cause.
            property 'axion.essai.relance_lecture', project.hasProperty('essaiRelance').toString()
            property 'axion.souris.libre', 'true'
            // Le défaut ouvert de sa connexion (ADR-168, précision 6c-B) : chaque lecture et écriture de socket du client.
            jvmArg "-XX:StartFlightRecording=filename=${rootProject.file('.runs/essai-prediction/essai-reseau.jfr')},settings=${rootProject.file('tools/ci/essai_reseau.jfc')},dumponexit=true"
        }

        gameTestServer {
            // Un dossier à part, dont le monde est effacé avant chaque passage : les GameTests
            // partent d'un monde neuf (R-2190) et ne laissent rien dans celui de développement.
            workingDirectory rootProject.file('.runs/gametest')
            // ADR-166 D3 : les GameTests de l'addon temoin, ecrits avec le kit de l'API, tournent avec ceux d'AXION.
            property 'forge.enabledGameTestNamespaces', "${mod_id},example_addon"
            // T-437 : chaque écriture de fichier de la session, avec sa pile, pour l'audit qui suit le passage.
            jvmArg "-XX:StartFlightRecording=filename=${new File(auditEcritures, 'ecritures.jfr')},settings=${rootProject.file('tools/ci/audit_ecritures.jfc')},dumponexit=true"
            jvmArg '-XX:FlightRecorderOptions=stackdepth=256'
            // ADR-162 D9 : /axion dev reload, et le dossier du contenu de développement tel que le jeu le lit, où son
            // GameTest ajoute puis retire un fichier (RechargementDevGameTests).
            property 'axion.content.dev_reload', 'true'
            property 'axion.essai.devcontent', sourceSets.devcontent.output.resourcesDir.absolutePath
            // R-1790 : le contenu de démonstration, éteint par défaut, se charge et se vérifie ici (ExemplesGameTests).
            property 'axion.content.examples', 'true'
        }

        essaiRechargementDev {
            // ADR-162 D9, essai de bout en bout en solo (EssaiRechargementDev, contenu de développement) : un modèle
            // et une definition ajoutés au dossier du mod, /axion dev reload, l'objet en jeu, une capture, l'arrêt.
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/essai-rechargement')
            property 'axion.essai.rechargement', 'true'
            property 'axion.essai.devcontent', sourceSets.devcontent.output.resourcesDir.absolutePath
            property 'axion.souris.libre', 'true'
        }

        essaiCaptureDemarrage {
            // ADR-166 D1 : le premier ecran apres le chargement (avertissements de Forge compris), au journal et en
            // capture (EssaiCaptureDemarrage, contenu de developpement), puis l'arret.
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/essai-demarrage')
            property 'axion.essai.capture.demarrage', 'true'
            property 'axion.souris.libre', 'true'
        }

        filmVehicule {
            // Le film de l'avancée (ADR-159) : un client qui joue sa scène, se filme et s'arrête ;
            // tools/film/encoder.py assemble ses images en MP4.
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/film')
            property 'axion.film', 'vehicule'
            property 'axion.souris.libre', 'true'
            // Le modèle local de Killian, hors du dépôt, s'il est là ; le buggy d'exemple sinon.
            def local = rootProject.file('local/contenu/axion/definitions/local/charger.json').exists()
            property 'axion.film.definition', local ? 'axion:local/charger' : 'axion:test/vehicule'
            jvmArgs '-Xmx4G'
            args '--width', '1920', '--height', '984'
        }

        filmParametres {
            // ADR-167, sous-tranche 5a : deux buggys identiques, l'un regle par /axion params (FilmDesParametres).
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/film-parametres')
            property 'axion.film', 'parametres'
            property 'axion.souris.libre', 'true'
            jvmArgs '-Xmx4G'
            args '--width', '1920', '--height', '984'
        }

        filmSport {
            // ADR-167, sous-tranche 5b : le mode sport du buggy d'exemple, mis par sa touche (FilmDesParametres).
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/film-sport')
            property 'axion.film', 'sport'
            property 'axion.souris.libre', 'true'
            // La Charger locale de Killian, hors du depot, si elle est la ; le buggy d'exemple sinon, contenu de
            // demonstration (R-1790) eteint par defaut.
            def local = rootProject.file('local/contenu/axion/definitions/local/charger.json').exists()
            property 'axion.film.definition', local ? 'axion:local/charger' : 'axion:example/buggy'
            property 'axion.content.examples', 'true'
            jvmArgs '-Xmx4G'
            args '--width', '1920', '--height', '984'
        }

        filmLimiteur {
            // ADR-167, sous-tranche 5c : le limiteur de vitesse de l'addon temoin, un controleur de vehicule attache
            // par l'API, et sa vitesse maximale, un parametre d'addon (FilmDesParametres).
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/film-limiteur')
            property 'axion.film', 'limiteur'
            property 'axion.souris.libre', 'true'
            def local = rootProject.file('local/contenu/axion/definitions/local/charger.json').exists()
            property 'axion.film.definition', local ? 'axion:local/charger' : 'axion:example/buggy'
            property 'axion.content.examples', 'true'
            jvmArgs '-Xmx4G'
            args '--width', '1920', '--height', '984'
        }

        renderTest {
            // Banc de rendu client (ADR-126) : un client qui joue son scénario, écrit son rapport
            // et s'arrête seul. Un dossier à part, dont le monde est effacé avant chaque passage ;
            // le contrôle de l'état GL (R-1503) y est actif. Le backend est imposé : laissé à
            // `auto`, ce serait le natif, et plus rien ne vérifierait le vanilla (R-1491).
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/rendertest')
            property 'axion.rendertest', 'm3'
            property 'axion.debug.gl', 'true'
            property 'axion.render.backend', 'vanilla'
            property 'axion.souris.libre', 'true'
            // T-493 : le plafond de sommets skinnés sur le CPU (R-742), abaissé pour que les bras de test
            // l'atteignent avant le plafond d'instances skinnées (R-791) ; au défaut, il en faudrait plus d'un
            // millier.
            property 'axion.render.vanilla_max_skinned_vertices', '400'
            args '--width', '854', '--height', '480'
        }

        renderTestNative {
            // Le même banc sur le backend natif (ADR-127 §7), dans son propre dossier : le banc
            // échoue si ce n'est pas lui qui dessine.
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/rendertest-native')
            property 'axion.rendertest', 'm3'
            property 'axion.debug.gl', 'true'
            property 'axion.render.backend', 'native'
            property 'axion.souris.libre', 'true'
            args '--width', '854', '--height', '480'
        }

        renderTestShaders {
            // Le banc sous Oculus et son shaderpack de test (T-480, T-490), dans son propre dossier.
            // Le backend n'est pas imposé : c'est la sélection automatique (R-1490) qui doit
            // retenir le vanilla parce qu'un mod de shaders est là.
            parent minecraft.runs.client
            workingDirectory rootProject.file('.runs/rendertest-shaders')
            property 'axion.rendertest', 'm3'
            property 'axion.rendertest.shaders', 'true'
            property 'axion.debug.gl', 'true'
            property 'axion.souris.libre', 'true'
            // Les mixins d'Oculus et d'Embeddium, remappés par fg.deobf, retrouvent leurs cibles
            // sous les noms de développement.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--width', '854', '--height', '480'
        }

        data {
            workingDirectory rootProject.file('.runs/data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Ressources produites par les generateurs de donnees.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// R-2231 : un resultat de benchmark porte le commit qu'il mesure. Le build l'ecrit dans une
// ressource que /axion bench relit (BuildInfo) ; un arbre suivi modifie le dit (`-dirty`), sans
// quoi la mesure d'un code non commite passerait pour celle du commit. La tache tourne a chaque
// build ; tant que le commit ne change pas, le contenu non plus, et processResources reste a jour.
def buildInfoDir = layout.buildDirectory.dir('generated/buildinfo')
def generateBuildInfo = tasks.register('generateBuildInfo') {
    group = 'axion'
    description = 'Commit du build, pour la provenance des benchmarks (R-2231)'
    def root = rootDir
    outputs.dir(buildInfoDir)
    outputs.upToDateWhen { false }
    doLast {
        def git = { List<String> args ->
            try {
                def process = (['git'] + args).execute(null, root)
                String text = process.text.trim()
                return process.waitFor() == 0 ? text : null
            } catch (IOException ignored) {
                return null
            }
        }
        String commit = git(['rev-parse', 'HEAD']) ?: System.getenv('GITHUB_SHA') ?: 'inconnu'
        String changes = git(['status', '--porcelain', '--untracked-files=no'])
        if (changes) {
            commit = commit + '-dirty'
        }
        File file = buildInfoDir.get().file('axion-build.properties').asFile
        String content = 'commit=' + commit + '\n'
        if (!file.exists() || file.getText('UTF-8') != content) {
            file.parentFile.mkdirs()
            file.setText(content, 'UTF-8')
        }
    }
}
sourceSets.main.resources { srcDir generateBuildInfo }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation project(':axion-api')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Tests unitaires cote Java. La CI execute `cargo nextest` et JUnit cote a
    // cote (34.3, job test-unit).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // R-2240 : JMH pour les micro-benchmarks Java (B-07, aller-retour FFI). La
    // PARTIE 32.2 le retient en « tests seulement » : il n'est jamais embarque
    // dans le JAR du mod, seulement present a l'execution des benchmarks. Les
    // classes @Benchmark vivent dans src/test/java (arbre fige, PARTIE 33), sans
    // nouveau source set.
    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

// Le mod de shaders du banc runRenderTestShaders (T-480, T-490) : Oculus, et Embeddium dont il
// dépend, depuis le dépôt Maven de Modrinth, en versions figées (accord de Killian, 2026-10-12).
// Ils ne rejoignent le classpath que lorsque ce banc est demandé : ni runClient, ni les autres
// bancs, ni le JAR livré ne les voient — AXION n'en dépend pas, il les détecte (H-09). Pour un
// essai à la main sous Oculus : `./gradlew runClient -Paxion.shaderMods`.
repositories {
    // Pas d'exclusiveContent : les versions remappées par fg.deobf, du même groupe, viennent du
    // dépôt local de ForgeGradle.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
if (project.hasProperty('axion.shaderMods')
        || gradle.startParameter.taskNames.any { it.endsWith('runRenderTestShaders') }) {
    dependencies {
        runtimeOnly fg.deobf('maven.modrinth:oculus:1.20.1-1.8.0')
        runtimeOnly fg.deobf('maven.modrinth:embeddium:0.3.31+mc1.20.1')
    }
}

// ForgeGradle cree ses taches run apres l'evaluation du script : `tasks.named`
// echouerait ici, `tasks.matching {}.configureEach` configure la tache des
// qu'elle apparait.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete rootProject.file('.runs/gametest/world')
        // Le journal latéral suit le monde (22.5.2) : celui d'un monde effacé, de même chemin et de même
        // graine, restaurerait dans le monde neuf les assemblies du passage précédent.
        delete rootProject.file('.runs/gametest/axion/world')
        // Un cache d'assets neuf : chaque passage compile ses sources, et ce qu'une compilation
        // journalise (ADR-148) s'y constate — un asset repris du cache ne dit rien.
        delete rootProject.file('.runs/gametest/axion/cache')
        // Un monde reproductible (R-2190, ADR-124 §5) : plat, de graine fixe, sans structure ni
        // créature. Sans server.properties, le serveur de GameTests générait un monde normal de
        // graine aléatoire : selon la graine, l'eau d'un aquifère gagnait une arène et y emportait
        // un cube (CI de 6cdc2ec, 2026-10-12), et des créatures auraient pu pousser les corps par
        // leurs proxies (R-614). Les autres réglages du fichier sont gardés.
        def proprietes = rootProject.file('.runs/gametest/server.properties')
        def reglages = new Properties()
        if (proprietes.exists()) {
            proprietes.withInputStream { reglages.load(it) }
        }
        reglages.putAll([
                'level-type'         : 'minecraft:flat',
                'level-seed'         : '20261012',
                'generate-structures': 'false',
                'difficulty'         : 'peaceful',
                'spawn-monsters'     : 'false',
                'spawn-animals'      : 'false',
                'spawn-npcs'         : 'false',
        ])
        proprietes.parentFile.mkdirs()
        proprietes.withOutputStream { reglages.store(it, 'AXION : monde des GameTests reproductible (ADR-124 5)') }
        // T-437 : le dossier de jeu tel que le passage le trouve, et un enregistrement neuf.
        delete new File(auditEcritures, 'ecritures.jfr')
        project.exec {
            commandLine python, rootProject.file('tools/ci/audit_ecritures.py'), 'releve',
                    rootProject.file('.runs/gametest'), new File(auditEcritures, 'releve.json')
        }
    }
    // T-437 (R-1711) : rien d'AXION hors du NBT de ses entités, d'axion_registry et de <gameDir>/axion/.
    doLast {
        project.exec {
            commandLine python, rootProject.file('tools/ci/audit_ecritures.py'), 'verifier',
                    rootProject.file('.runs/gametest'), new File(auditEcritures, 'releve.json'),
                    new File(auditEcritures, 'ecritures.jfr'), sourceSets.main.java.classesDirectory.get().asFile,
                    new File(System.getProperty('java.home'), windows ? 'bin/java.exe' : 'bin/java')
        }
    }
}

// Le client de développement ne se met pas en pause quand sa fenêtre perd le focus : un essai lancé
// pendant qu'une autre application est au premier plan resterait figé sur le menu de pause, le monde
// solo arrêté. L'option est reposée à chaque lancement ; F3+P la bascule le temps d'une partie. Les
// bancs de rendu la règlent eux-mêmes (`BancDeRendu.reglerLesOptions`).
tasks.matching { it.name == 'runClient' }.configureEach {
    doFirst {
        def options = rootProject.file('.runs/client/options.txt')
        def lignes = options.exists()
                ? options.readLines('UTF-8').findAll { !it.startsWith('pauseOnLostFocus:') }
                : []
        lignes << 'pauseOnLostFocus:false'
        options.parentFile.mkdirs()
        options.setText(lignes.collect { it + System.lineSeparator() }.join(''), 'UTF-8')
    }
}

// CAP-49 : chaque lancement charge l'addon temoin depuis ses dossiers de sortie. ForgeGradle n'en deduit
// aucune dependance : sur un clone neuf (la CI), ces dossiers n'existeraient pas, et Forge refuserait de demarrer
// (« Invalid paths argument, contained no existing paths »). Chaque preparation de lancement compile donc le temoin.
tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
    dependsOn ':addon-temoin:classes'
}

// Un client lancé par un agent : ni question du narrateur au premier lancement, ni son, ni menu de pause quand sa
// fenêtre perd le focus — SourisLibre la dit inactive à chaque tick, et un menu de pause relâche les touches qu'un
// essai presse (essai de la prédiction, 2026-11-13).
def clientSilencieux = { File dossier ->
    def options = new File(dossier, 'options.txt')
    def regles = [onboardAccessibility: 'false', narrator: '0', soundCategory_master: '0.0', pauseOnLostFocus: 'false']
    def lignes = options.exists() ? options.readLines('UTF-8').findAll { !regles.containsKey(it.split(':', 2)[0]) } : []
    regles.each { cle, valeur -> lignes << "${cle}:${valeur}" }
    dossier.mkdirs()
    def fin = System.lineSeparator()
    options.setText(lignes.join(fin) + fin, 'UTF-8')
}

// ADR-165 D3 : le client d'essai, muet ; le serveur d'essai est runServer, sous AXION_ESSAI_ADDON_EXIGE.
tasks.matching { it.name == 'runEssaiClientAddons' }.configureEach {
    standardInput = new ByteArrayInputStream("n${System.lineSeparator()}".getBytes('US-ASCII'))
    doFirst {
        clientSilencieux(rootProject.file('.runs/essai-client'))
    }
}

// ADR-168 : le client de l'essai de la prédiction, muet ; son serveur est runServer, sous AXION_ESSAI_PREDICTION=1.
tasks.matching { it.name == 'runEssaiClientPrediction' }.configureEach {
    standardInput = new ByteArrayInputStream("n${System.lineSeparator()}".getBytes('US-ASCII'))
    doFirst {
        clientSilencieux(rootProject.file('.runs/essai-prediction'))
    }
}

// ADR-166 D1 : l'essai de l'ecran de fin de chargement, muet.
tasks.matching { it.name == 'runEssaiCaptureDemarrage' }.configureEach {
    standardInput = new ByteArrayInputStream("n${System.lineSeparator()}".getBytes('US-ASCII'))
    doFirst {
        clientSilencieux(rootProject.file('.runs/essai-demarrage'))
    }
}

// ADR-162 D9 : l'essai du rechargement en solo, muet, sans pause au focus perdu, dans un monde neuf.
tasks.matching { it.name == 'runEssaiRechargementDev' }.configureEach {
    standardInput = new ByteArrayInputStream("n${System.lineSeparator()}".getBytes('US-ASCII'))
    doFirst {
        def dossier = rootProject.file('.runs/essai-rechargement')
        clientSilencieux(dossier)
        def options = new File(dossier, 'options.txt')
        def lignes = options.readLines('UTF-8').findAll { !it.startsWith('pauseOnLostFocus:') }
        lignes << 'pauseOnLostFocus:false'
        options.setText(lignes.collect { it + System.lineSeparator() }.join(''), 'UTF-8')
        delete new File(dossier, 'saves/essai-rechargement-dev')
    }
}

// Un film se tourne dans un monde neuf.
tasks.matching { it.name == 'runFilmVehicule' }.configureEach {
    standardInput = new ByteArrayInputStream('n\n'.getBytes('US-ASCII'))
    doFirst {
        clientSilencieux(rootProject.file('.runs/film'))
        delete rootProject.file('.runs/film/saves/axion-film')
        // Le contenu, pas le dossier : un dossier ouvert ailleurs ne doit pas faire échouer le tournage.
        delete fileTree(rootProject.file('.runs/film/axion-film'))
        delete rootProject.file('.runs/film/axion/world')
    }
}

['runFilmParametres': 'parametres', 'runFilmSport': 'sport', 'runFilmLimiteur': 'limiteur'].each { tache, scene ->
    tasks.matching { it.name == tache }.configureEach {
        standardInput = new ByteArrayInputStream('n\n'.getBytes('US-ASCII'))
        doFirst {
            clientSilencieux(rootProject.file(".runs/film-${scene}"))
            delete rootProject.file(".runs/film-${scene}/saves/axion-film-${scene}")
            delete fileTree(rootProject.file(".runs/film-${scene}/axion-film"))
            delete rootProject.file(".runs/film-${scene}/axion/world")
        }
    }
}

// Banc de rendu (ADR-126), sur chaque backend : un monde et un rapport neufs à chaque passage ; la
// tâche échoue si le rapport manque ou n'est pas vert.
['runRenderTest': '.runs/rendertest', 'runRenderTestNative': '.runs/rendertest-native',
        'runRenderTestShaders': '.runs/rendertest-shaders'].each { tache, dossier ->
    tasks.matching { it.name == tache }.configureEach {
        // Une fenêtre de chargement anticipée qui ne s'ouvre pas en 30 s fait poser par Forge une
        // question y/n sur l'entrée standard ; vide, elle la faisait reposer sans fin (run
        // 40031334950 de la CI : 13,8 Go de journal). Répondre non arrête le client net.
        standardInput = new ByteArrayInputStream('n\n'.getBytes('US-ASCII'))
        doFirst {
            // Sous rendu logiciel (llvmpipe, la CI), GL 4.6 n'existe pas : la fenêtre anticipée de Forge
            // le sonde d'abord, et cette sonde se bloque parfois jusqu'au minuteur de 10 s de Forge (run
            // 40139908450, deux tentatives), quand elle échoue d'habitude aussitôt pour obtenir 4.5. La
            // sauter rend le même contexte 4.5, sans la sonde. Sur une vraie carte, rien ne change : le
            // banc garde le contexte qu'obtiennent les joueurs.
            if (System.getenv('LIBGL_ALWAYS_SOFTWARE') == '1') {
                def fml = rootProject.file("${dossier}/config/fml.toml")
                def lignes = fml.exists()
                        ? fml.readLines('UTF-8').findAll { !it.trim().startsWith('earlyWindowSkipGLVersions') }
                        : []
                lignes << 'earlyWindowSkipGLVersions = ["4.6"]'
                fml.parentFile.mkdirs()
                fml.setText(lignes.collect { it + System.lineSeparator() }.join(''), 'UTF-8')
            }
            clientSilencieux(rootProject.file(dossier))
            delete rootProject.file("${dossier}/saves/axion-rendertest")
            delete rootProject.file("${dossier}/axion-rendertest")
            // Le journal latéral suit le monde effacé (22.5.2).
            delete rootProject.file("${dossier}/axion/world")
            // Un cache de shaders neuf : le premier démarrage compile, les suivants relisent (T-905).
            delete rootProject.file("${dossier}/axion/cache")
            // Un cache d'assets du client neuf (ADR-150 D3) : chaque passage compile chez le client,
            // et une compilation qui n'avancerait pas s'y voit — un asset repris du cache ne compile rien.
            delete rootProject.file("${dossier}/axion/client-cache")
            // T-483 : le pack de test que le banc active puis retire, posé neuf.
            def pack = rootProject.file("${dossier}/resourcepacks/axion_banc_pack")
            delete pack
            copy {
                from file('src/devcontent/resourcepacks/axion_banc_pack')
                into pack
            }
        }
        doLast {
            def rapport = rootProject.file("${dossier}/axion-rendertest/rapport.json")
            if (!rapport.exists()) {
                throw new GradleException("banc de rendu : aucun rapport (${rapport}) — le client s'est arrêté avant d'écrire")
            }
            def contenu = new groovy.json.JsonSlurper().parse(rapport, 'UTF-8')
            if (contenu.verdict != 'vert') {
                def rouges = contenu.tests.findAll { it.verdict == 'rouge' }.collect { "${it.id} : ${it.detail}" }
                throw new GradleException("banc de rendu rouge :\n  " + rouges.join('\n  '))
            }
            logger.lifecycle("banc de rendu vert : ${contenu.tests.collect { it.id }.join(', ')}")
            // Une vérification mesurée sans être jugée (rendu logiciel, ADR-127 §4) se dit, même au vert.
            def nonJuges = contenu.tests.findAll { it.verdict == 'non jugé' }.collect { it.id }
            if (nonJuges) {
                logger.warn("banc de rendu : non jugé(s) — ${nonJuges.join(', ')} (voir rapport.json)")
            }
        }
    }
}

// Sous Oculus (T-480, T-490) : le shaderpack de test, écrit pour le banc, et la configuration
// d'Oculus qui l'active, posés neufs avant chaque passage.
tasks.matching { it.name == 'runRenderTestShaders' }.configureEach {
    doFirst {
        def jeu = rootProject.file('.runs/rendertest-shaders')
        delete new File(jeu, 'shaderpacks/axion_banc')
        copy {
            from file('src/devcontent/shaderpacks/axion_banc')
            into new File(jeu, 'shaderpacks/axion_banc')
        }
        def config = new File(jeu, 'config/oculus.properties')
        config.parentFile.mkdirs()
        config.setText('shaderPack=axion_banc\nenableShaders=true\n', 'UTF-8')
    }
}

tasks.matching { it.name in ['runServer', 'runClient', 'runGameTestServer'] }.configureEach {
    // Sans cela, la console du serveur ne lit rien : impossible de lui envoyer
    // une commande, ni `stop`. Or un serveur tue par un timeout ne declenche
    // jamais son evenement d'arret, et l'arret propre ne serait donc jamais
    // verifie.
    standardInput = System.in
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Le test de la frontiere charge la bibliotheque native construite par
    // cargo. M0.8 rendra cette construction dependance du build ; d'ici la, le
    // test se declare non applicable si le binaire n'est pas la, en disant
    // comment le produire.
    systemProperty 'axion.native.dir', rootProject.file('target/release').absolutePath
    // T-020 verifie R-401 sur les sources : aucune classe hors de
    // dev.axion.forge n'importe net.minecraftforge.
    systemProperty 'axion.source.dir', file('src/main/java').absolutePath
    // R-2392 verifie que les tests declares par un jalon clos existent
    // toujours ; il lit pour cela les sources de test, des deux cotes.
    systemProperty 'axion.test.dir', file('src/test/java').absolutePath
    // Les GameTests et le banc de rendu portent aussi des tests de jalon (M3).
    systemProperty 'axion.devcontent.dir', file('src/devcontent/java').absolutePath
    // Les campagnes et les audits de CI en portent d'autres (M4 : T-435, T-437).
    systemProperty 'axion.tools.dir', rootProject.file('tools').absolutePath
    // T-019 (INV-12) lit le bytecode du moteur : aucun appel GL hors du render thread.
    systemProperty 'axion.classes.dir', sourceSets.main.java.classesDirectory.get().asFile.absolutePath
    // R-1751 : la version que porte l'artefact axion-api, confrontee a ApiVersion.CURRENT.
    // Lue au lancement de la JVM de test : a la configuration d'axion-mod, celle d'axion-api
    // n'a peut-etre pas encore fixe sa version.
    def apiProject = project(':axion-api')
    // Declaree en entree : sans cela, un changement de version laisserait les tests a jour.
    inputs.property('axion.api.artifact.version', provider { apiProject.version.toString() })
    jvmArgumentProviders.add({ ['-Daxion.api.artifact.version=' + apiProject.version] } as CommandLineArgumentProvider)
    // T-022 et T-023 verifient sur les deux cotes : aucune connexion sortante,
    // et tout code d'erreur documente en ANNEXE A.1.
    systemProperty 'axion.crates.dir', rootProject.file('crates').absolutePath
    systemProperty 'axion.spec.file',
            rootProject.file('docs/spec/AXIONENGINE_Cahier_des_Charges_v1.0.md').absolutePath
    // T-284 (R-1783) : le schema publie est le rendu exact du validateur, et
    // toute definition du depot le respecte. `-Daxion.schema.update=true`
    // regenere le fichier au lieu de seulement le comparer.
    systemProperty 'axion.schema.file', rootProject.file('docs/schema/definition-1.json').absolutePath
    // Le schema 2 (ADR-151 D3), publie de meme.
    systemProperty 'axion.schema2.file', rootProject.file('docs/schema/definition-2.json').absolutePath
    // Le schema 3 (ADR-163 D2) : les variables et ce qui les ecrit.
    systemProperty 'axion.schema3.file', rootProject.file('docs/schema/definition-3.json').absolutePath
    // Le schema 4 (ADR-167) : le reglage des parametres d'une instance.
    systemProperty 'axion.schema4.file', rootProject.file('docs/schema/definition-4.json').absolutePath
    systemProperty 'axion.repo.dir', rootProject.projectDir.absolutePath
    // Les schemas publies (definition, persistence-5.md) sont lus par les tests : declares en
    // entree, un document modifie seul relance les tests au lieu de les laisser a jour.
    inputs.files(rootProject.fileTree('docs/schema')).withPropertyName('axion.publishedSchemas')
    systemProperty 'axion.schema.update', System.getProperty('axion.schema.update', 'false')
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// R-2240 : lance les micro-benchmarks JMH (classes @Benchmark de src/test/java).
// La bibliotheque native doit exister ; on la construit avec
// `cargo build -p ax-ffi --release`, et le dossier ou la trouver est passe au
// benchmark. JMH fork un JVM par benchmark : le fork herite de l'environnement
// du processus, on passe donc le dossier par une variable d'environnement. Un
// -jvmArgs ne marcherait pas ici : JMH resplit sa valeur sur les espaces, et le
// chemin du depot en contient un.
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Micro-benchmarks JMH (B-07, aller-retour FFI)'
    dependsOn 'testClasses'
    mainClass = 'org.openjdk.jmh.Main'
    classpath = sourceSets.test.runtimeClasspath
    environment 'AXION_NATIVE_DIR', rootProject.file('target/release').absolutePath
    // Des arguments JMH supplementaires se passent par -Pjmh.args="..." (regex de
    // benchmark, nombre d'iterations, forks) et surchargent les annotations.
    if (project.hasProperty('jmh.args')) {
        args((project.property('jmh.args') as String).split('\\s+'))
    }
}

// Developpe les proprietes du projet dans les ressources qui les referencent.
// Une propriete manquante fait echouer le build.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // Embarque l'API dans l'artefact du mod ; reobfJar traite ensuite
    // l'ensemble, API comprise.
    from project(':axion-api').sourceSets.main.output

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                // Pas d'horodatage : R-2342 impose un build reproductible, et
                // une date d'assemblage suffirait a rendre deux artefacts du
                // meme code differents — donc a priver toute empreinte publiee
                // de sa valeur.
        ])
    }

    finalizedBy 'reobfJar'
}

// CAP-48 (ADR-162 D11, tranche 5) : le JAR d'AXION, API comprise, se publie sur le depot Maven d'AXION. Un addon
// le declare en runtimeOnly fg.deobf(...) pour lancer le jeu en developpement avec AXION ; en jeu, le joueur
// installe ce meme JAR. R-2341 : un JAR partial ne se publie pas, quelle que soit la facon de lancer la
// publication ; validateJar passe avant.
apply from: rootProject.file('gradle/publication.gradle')

publishing {
    publications {
        register('mod', MavenPublication) {
            artifactId = mod_id
            artifact jar
            axionPom(pom, 'AXION ENGINE', 'Physique, deformation et rendu 3D pour Minecraft Forge 1.20.1.')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn 'reobfJar', 'validateJar'
    doFirst {
        def partiel = layout.buildDirectory.file('natives-partial.txt').get().asFile
        if (partiel.exists()) {
            throw new GradleException('R-2341 : un JAR partial ne se publie pas ; cibles manquantes : '
                    + partiel.text.trim().readLines().join(', '))
        }
    }
}
