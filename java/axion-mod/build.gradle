// Le mod Forge AXION ENGINE.
//
// Les classes de :axion-api sont embarquees dans le JAR final : l'artefact
// publie contient dev/axion/**/*.class, y compris dev/axion/api/** (33.2).
// L'API est aussi publiee separement comme artefact propre (R-1750).
evaluationDependsOn(':axion-api')

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

base {
    archivesName = mod_id
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Requis par ce template : fait tourner processResources sur les sorties de
    // l'IDE avant le lancement du jeu.
    copyIdeResources = true

    runs {
        configureEach {
            // Les repertoires de travail restent a la racine du depot.
            workingDirectory rootProject.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    // L'API fait partie du meme mod en developpement.
                    source project(':axion-api').sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory rootProject.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Ressources produites par les generateurs de donnees.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation project(':axion-api')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Tests unitaires cote Java. La CI execute `cargo nextest` et JUnit cote a
    // cote (34.3, job test-unit).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Le test de la frontiere charge la bibliotheque native construite par
    // cargo. M0.8 rendra cette construction dependance du build ; d'ici la, le
    // test se declare non applicable si le binaire n'est pas la, en disant
    // comment le produire.
    systemProperty 'axion.native.dir', rootProject.file('target/release').absolutePath
    // T-020 verifie R-401 sur les sources : aucune classe hors de
    // dev.axion.forge n'importe net.minecraftforge.
    systemProperty 'axion.source.dir', file('src/main/java').absolutePath
    // T-022 et T-023 verifient sur les deux cotes : aucune connexion sortante,
    // et tout code d'erreur documente en ANNEXE A.1.
    systemProperty 'axion.crates.dir', rootProject.file('crates').absolutePath
    systemProperty 'axion.spec.file',
            rootProject.file('cdc/AXIONENGINE_Cahier_des_Charges_v1.0.md').absolutePath
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Developpe les proprietes du projet dans les ressources qui les referencent.
// Une propriete manquante fait echouer le build.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // Embarque l'API dans l'artefact du mod ; reobfJar traite ensuite
    // l'ensemble, API comprise.
    from project(':axion-api').sourceSets.main.output

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }

    finalizedBy 'reobfJar'
}
