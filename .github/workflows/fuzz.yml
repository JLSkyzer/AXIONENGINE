# Fuzzing de la chaine d'assets — R-903, T-680..T-682, PARTIE 34.3.
#
# Workflow separe de ci.yml, et pas par gout : `cargo-fuzz` exige une chaine
# `nightly` et un desinfecteur d'adresses. La chaine epinglee par
# rust-toolchain.toml reste celle qui construit tout ce qui est livre — le noyau
# deterministe de C-16 en depend pour sa matrice de validation.
#
# # Cadences
#
# 34.3 en prevoit deux : `fuzz-short`, dix minutes par cible sur les PR, et une
# campagne nocturne d'une heure par cible.
#
#   - `fuzz-short` est ici, declenche par les PR qui touchent la chaine d'assets
#     ou les cibles elles-memes. Quarante minutes Linux, facturees au simple.
#   - **La campagne nocturne n'est pas programmee.** Quatre cibles pendant une
#     heure, chaque nuit, font sept mille deux cents minutes par mois sur un
#     depot prive qui en compte deux mille. La declencher a la main reste
#     possible — c'est ce que `minutes_par_cible: 60` fait —, et l'ecart avec
#     34.3 est consigne dans tasks/todo.md plutot que masque par un `cron` qui
#     epuiserait le quota en quatre nuits.
#
# # Ce qu'un echec veut dire
#
# R-903 impose la tolerance zero. Une entree qui fait paniquer, deborder ou
# boucler un lecteur est un defaut, pas un cas limite : ces lecteurs recoivent
# des fichiers fournis par des tiers. L'entree fautive est publiee en artefact,
# parce qu'un defaut de fuzzing ne vaut que s'il se rejoue :
#
#     cargo +nightly fuzz run <cible> fuzz/artifacts/<cible>/<fichier>

name: Fuzzing

on:
  workflow_dispatch:
    inputs:
      minutes_par_cible:
        description: >-
          Duree de la campagne, par cible, en minutes. 10 pour un passage de
          controle ; 60 pour l'acceptance de M1, qui demande une heure sans
          incident.
        type: string
        default: "10"
  pull_request:
    paths:
      - "crates/ax-asset/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.cible }})
    runs-on: ubuntu-latest
    # Une marge au-dela de la campagne : la compilation des cibles et
    # l'installation de cargo-fuzz ne sont pas du temps de fuzzing.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cible: [a3d_reader, gltf, obj, stl]
    steps:
      - uses: actions/checkout@v4

      # `nightly` n'est installee que pour ce workflow. Elle ne construit rien
      # de ce qui est livre.
      - name: Chaine nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup run nightly rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            fuzz/target
          key: fuzz-${{ matrix.cible }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: fuzz-${{ matrix.cible }}-

      - name: Installer cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null; then
            cargo install cargo-fuzz --locked
          fi
          cargo fuzz --version

      # Le corpus versionne est le point de depart. Un fuzzer parti de rien
      # passe l'essentiel de sa campagne a reinventer un en-tete valide.
      - name: Corpus de depart
        run: |
          echo "graines pour ${{ matrix.cible }} :"
          ls -la "fuzz/corpus/${{ matrix.cible }}"

      - name: Campagne
        env:
          MINUTES: ${{ inputs.minutes_par_cible || '10' }}
        run: |
          set -o pipefail
          secondes=$(( MINUTES * 60 ))
          echo "campagne de ${MINUTES} minute(s) sur ${{ matrix.cible }}"
          cargo +nightly fuzz run "${{ matrix.cible }}" -- \
            -max_total_time="$secondes" \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -print_final_stats=1

      # L'entree fautive d'abord : c'est elle qui permet de rejouer le defaut.
      - name: Entree fautive
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.cible }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

      # Le corpus enrichi par la campagne. Il n'est pas commite automatiquement :
      # une campagne d'une heure produit des milliers d'entrees, et un corpus
      # qu'on laisse grossir sans regard cesse d'etre relisible. A trier a la
      # main, avec `cargo fuzz cmin` pour n'en garder que la couverture.
      - name: Corpus enrichi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.cible }}
          path: fuzz/corpus/${{ matrix.cible }}/
          if-no-files-found: warn
          retention-days: 14
