# Workspace Rust d'AXION ENGINE.
#
# La partie native porte la simulation, la deformation, les assets et le noyau
# deterministe ; la carte crate -> composant est tenue dans
# docs/spec/CRATES.md et figee par la PARTIE 33 du cahier des charges.
#
# Un seul crate produit une bibliotheque dynamique : ax-ffi (C-14), qui expose
# les points d'entree JNI. Tous les autres sont des rlib internes.
[workspace]
resolver = "2"
# `tools/codegen` genere le code Java depuis ax-model (PARTIE 33) ; il vit hors
# de crates/ parce qu'il ne fait pas partie de la bibliotheque native livree.
members = ["crates/*", "tools/codegen"]
# `fuzz/` est un workspace a lui seul : ses cibles dependent de
# `libfuzzer-sys`, qui exige une chaine nightly et un desinfecteur. Les
# inclure ici ferait echouer `cargo test --workspace` sur la chaine epinglee
# dont la matrice deterministe de C-16 depend.
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
# Le depot reel. L'ancienne valeur, « axion-engine », ne designait rien :
# elle voyageait pourtant dans le NOTICE et dans la SBOM.
repository = "https://github.com/JLSkyzer/AXIONENGINE"
authors = ["JLSkyzer"]
# Aucun crate de ce workspace ne se publie sur un registre. AXION se livre
# en JAR, et ces crates sont internes : une publication accidentelle
# exposerait une bibliotheque que personne ne doit dependre directement.
publish = false

[workspace.dependencies]
# Les versions communes se declarent ici pour rester alignees entre crates.
# R-2300 : toute nouvelle dependance exige justification, licence compatible,
# alternative evaluee, ajout au SBOM et au NOTICE, et un ADR si structurante.

# C-11 : impose par R-460, qui interdit a tout crate d'AXION de definir son
# propre type vecteur ou matrice. Licence MIT OR Apache-2.0, dans l'allowlist
# de deny.toml.
# `float-types` fournit les types f64 (DVec3, DMat4...), indispensables aux
# positions monde exigees par R-462. Les types entiers ne sont pas actives
# tant qu'aucun composant n'en a besoin.
glam = { version = "0.33", default-features = false, features = ["std", "float-types"] }

# C-04 : la configuration traverse la frontiere en CBOR (IF-01, `axion_init`).
# Retenus par la table des dependances du cahier des charges (32.2).
serde = { version = "1", default-features = false, features = ["std", "derive"] }
ciborium = { version = "0.2", default-features = false }

# C-72 : le harnais de benchmarks ecrit ses resultats en JSON (schema 2, PARTIE
# 30.4) ; R-2230 exige un fichier genere par le harnais. serde_json plutot qu'un
# ecrivain maison : l'echappement JSON correct est exactement ce qu'une
# implementation propre rate en silence, et le format archive doit etre fiable
# (R-2231). Licence MIT OR Apache-2.0, dans l'allowlist ; ses transitives (itoa,
# ryu, memchr) le sont aussi. Sa `Map` par defaut trie les cles, ce qui rend la
# sortie stable et diffable dans git.
serde_json = { version = "1", default-features = false, features = ["std"] }

# C-14 : points d'entree JNI. Egalement retenu par 32.2.
jni = { version = "0.21", default-features = false }

# C-15 (R-500) : temps CPU du thread qui fait le pas de simulation, pour le distinguer du
# temps mural, qui compte aussi les attentes du thread. Un appel systeme par plateforme :
# `clock_gettime(CLOCK_THREAD_CPUTIME_ID)` sous Unix, `QueryThreadCycleTime` sous Windows.
# Les deux crates etaient deja dans le graphe (outillage de build et de terminal) : aucune
# source tierce nouvelle, des licences deja admises (MIT OR Apache-2.0), et les liaisons
# systeme de reference, tenues par l'equipe Rust et par Microsoft. Alternatives evaluees :
# le crate `cpu-time`, qui enveloppe les memes appels pour une dependance de plus ;
# `GetThreadTimes`, qui n'avance que de 15,6 ms en 15,6 ms, muet sur un budget de 3 ms ;
# le temps mural seul, qui ne distingue pas un pas qui calcule d'un pas qui attend.
libc = { version = "0.2", default-features = false }
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# C-12 : impose par la fiche du composant, « pool dedie au-dessus de rayon,
# jamais le pool global » (R-470). Retenu par 32.2, licence MIT OR Apache-2.0.
# AXION n'utilise que `ThreadPoolBuilder` et `ThreadPool::spawn` : ni pool
# global, ni iterateurs paralleles implicites, qui s'executeraient dessus.
rayon = { version = "1.11", default-features = false }

# C-24 : integrite des sections A3D (R-882). CRC32C, et non CRC32 : c'est
# celui que R-271 impose deja a l'en-tete des tampons partages, et une seule
# fonction d'integrite pour tout le projet vaut mieux que deux. Retenu par 32.2,
# licence Apache-2.0.
crc32c = { version = "0.6", default-features = false }

# C-24 : compression des sections A3D. Retenu par 32.2, licence BSD-3-Clause,
# avec `lz4_flex` comme alternative evaluee. La decompression est toujours
# bornee par une taille de sortie connue a l'avance (R-902).
zstd = { version = "0.13", default-features = false }

# C-21 : import glTF 2.0 et GLB. Retenu par 32.2, licence MIT OR Apache-2.0.
# `default-features = false` ecarte la fonctionnalite `import`, qui lit des
# fichiers et resout des URI toute seule : R-531 veut que ce soit AXION qui
# decide ce qui est lisible, et un analyseur qui ouvre des chemins pour nous
# rendrait la regle inapplicable.
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "extras",
    # `extensions` conserve les extensions que le parseur ne modelise pas, au
    # lieu de refuser le document : R-530 en declare huit supportees, dont
    # trois que la bibliotheque ne connait pas. Les refuser reviendrait a etre
    # plus strict que le cahier des charges.
    "extensions",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "KHR_materials_specular",
    "KHR_materials_unlit",
    "KHR_texture_transform",
] }

# C-21 : import OBJ et MTL. Retenu par 32.2, licence MIT, alternative evaluee
# « parseur propre ». Pur Rust, sans dependance C.
tobj = { version = "4", default-features = false }

# C-21 : import STL. Retenu par 32.2, licence MIT. Pur Rust.
stl_io = { version = "0.8", default-features = false }

# C-23, etape 3 : tangentes MikkTSpace. Retenu par 32.2 (« reference »), avec
# l'alternative evaluee « implementation propre ». Licence reelle MIT OR
# Apache-2.0 et non Zlib comme l'annonce la table ; le code derive de MikkTSpace
# (zlib) est attribue dans le NOTICE. Voir docs/decisions/ADR-106.md.
# `glam` plutot que `nalgebra`, fonctionnalite par defaut : le crate n'en
# utilise que les types vecteurs, et `glam` 0.15 n'a aucune dependance quand
# `nalgebra` 0.26 en tire une dizaine.
mikktspace = { version = "0.3", default-features = false, features = ["glam"] }

# C-23, etape 5 : cache de sommets. Retenu par 32.2, licence MIT OR Apache-2.0,
# alternative evaluee « Forsyth propre ». Compile meshoptimizer (C++, MIT) par
# `cc` : un compilateur C++ est requis au build, ce que les runners de la CI
# fournissent sur les trois systemes. Voir docs/decisions/ADR-106.md.
meshopt = { version = "0.6", default-features = false }

# C-16 : empreinte de champ deterministe (digest64). Retenu par 32.2, qui lui
# attribue BSD-2-Clause ; le crate est en realite sous BSL-1.0, ecart consigne
# dans docs/decisions/ADR-105.md. Epingle au correctif pres : l'empreinte entre
# dans la verification de reconstruction, et une implementation qui changerait
# invaliderait tout ce qui a deja ete replique.
xxhash-rust = { version = "=0.8.15", default-features = false }

# C-31 : moteur physique (bodies, colliders, joints, CCD, sommeil). Décidé par
# ADR-002 et retenu par la table 32.2, licence Apache-2.0 ; alternatives évaluées
# et écartées là-bas (moteur propre — coût ; PhysX/Bullet/Jolt — build C++).
# `enhanced-determinism` activé (ADR-116, exécutant ADR-108) : la décomposition
# convexe de C-32 (parry3d, en jeu) doit être identique entre plateformes, et
# `parry3d` étant partagé (unification des features Cargo), la garantie s'étend à
# toute la physique runtime. C'est un choix assumé — libm logicielle, sans SIMD —
# qui réconcilie ADR-005 (qui l'écartait pour la perf) : le déterminisme
# inter-machines sert le refit (PARTIE 14.9) et, à terme, le réseau (C-16).
# `parry3d` et `nalgebra` sont ré-exportés par `rapier3d` (`rapier3d::parry`,
# `rapier3d::na`) ; `parry3d` devient dépendance directe d'ax-asset pour la VHACD.
# Les types Rapier ne franchissent jamais la frontière du crate (R-1753).
rapier3d = { version = "0.35", default-features = false, features = [
    "dim3",
    "f32",
    "std",
    "enhanced-determinism",
] }

# C-32 : décomposition convexe (VHACD) à la compilation d'asset. Même `parry3d`
# que celui de `rapier3d` (version et features unifiées, dont `enhanced-determinism`).
# `alloc` porte le module `transformation` (VHACD).
parry3d = { version = "0.30", default-features = false, features = [
    "dim3",
    "f32",
    "std",
    "alloc",
] }

# Crates internes.
ax-math = { path = "crates/ax-math" }
ax-mem = { path = "crates/ax-mem" }
ax-core = { path = "crates/ax-core" }
ax-jobs = { path = "crates/ax-jobs" }
ax-telemetry = { path = "crates/ax-telemetry" }
ax-asset = { path = "crates/ax-asset" }
ax-det = { path = "crates/ax-det" }
ax-model = { path = "crates/ax-model" }
ax-scene = { path = "crates/ax-scene" }
ax-physics = { path = "crates/ax-physics" }

# Les profils s'appliquent a tout le workspace.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# `panic = "abort"` est INTERDIT (R-312). La bibliotheque native enveloppe
# chaque point d'entree dans `catch_unwind` pour qu'aucune panic ne traverse la
# frontiere FFI (INV-05) ; avec `abort`, le processus mourrait avant d'etre
# capture, et le jeu crasherait au lieu de basculer en DISABLED.
panic = "unwind"
debug = 1

# Le noyau deterministe (C-16) exige des resultats bit-identiques entre client
# et serveur : ni contraction FMA, ni reassociation flottante. Ces garanties
# tiennent au niveau du code et des drapeaux de compilation, jamais d'une
# optimisation opportuniste du compilateur (interdiction 3.12).
[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
