# Workspace Rust d'AXION ENGINE.
#
# La partie native porte la simulation, la deformation, les assets et le noyau
# deterministe ; la carte crate -> composant est tenue dans
# docs/spec/CRATES.md et figee par la PARTIE 33 du cahier des charges.
#
# Un seul crate produit une bibliotheque dynamique : ax-ffi (C-14), qui expose
# les points d'entree JNI. Tous les autres sont des rlib internes.
[workspace]
resolver = "2"
# `tools/codegen` genere le code Java depuis ax-model (PARTIE 33) ; il vit hors
# de crates/ parce qu'il ne fait pas partie de la bibliotheque native livree.
members = ["crates/*", "tools/codegen"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/JLSkyzer/axion-engine"
authors = ["JLSkyzer"]

[workspace.dependencies]
# Les versions communes se declarent ici pour rester alignees entre crates.
# R-2300 : toute nouvelle dependance exige justification, licence compatible,
# alternative evaluee, ajout au SBOM et au NOTICE, et un ADR si structurante.

# C-11 : impose par R-460, qui interdit a tout crate d'AXION de definir son
# propre type vecteur ou matrice. Licence MIT OR Apache-2.0, dans l'allowlist
# de deny.toml.
# `float-types` fournit les types f64 (DVec3, DMat4...), indispensables aux
# positions monde exigees par R-462. Les types entiers ne sont pas actives
# tant qu'aucun composant n'en a besoin.
glam = { version = "0.33", default-features = false, features = ["std", "float-types"] }

# Crates internes.
ax-math = { path = "crates/ax-math" }
ax-mem = { path = "crates/ax-mem" }
ax-core = { path = "crates/ax-core" }
ax-model = { path = "crates/ax-model" }

# Les profils s'appliquent a tout le workspace.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

# Le noyau deterministe (C-16) exige des resultats bit-identiques entre client
# et serveur : ni contraction FMA, ni reassociation flottante. Ces garanties
# tiennent au niveau du code et des drapeaux de compilation, jamais d'une
# optimisation opportuniste du compilateur (interdiction 3.12).
[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
