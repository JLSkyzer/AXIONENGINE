// Racine du build AXION ENGINE.
//
// Le projet racine ne produit aucun artefact : il porte la configuration
// commune aux modules Java (PARTIE 33). Les deux modules sont
//   :axion-api  C-70, API publique versionnee et publiee separement (R-1750)
//   :axion-mod  le mod Forge lui-meme
buildscript {
    repositories {
        // Depot du plugin Mixin uniquement ; les dependances du projet se
        // declarent dans les modules.
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    // Applique par chaque module : ForgeGradle doit etre configure par projet.
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    group = mod_group_id
    version = mod_version

    java {
        // Minecraft 1.20.1 et Forge 47.x tournent sur Java 17 (hypothese H-01).
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
